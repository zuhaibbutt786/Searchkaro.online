name: Update courses and blog

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch courses + build on-site pages
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MAX_COURSE_DETAIL: '50'
        run: python scripts/fetch_courses.py
        continue-on-error: true

      - name: Generate blog posts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          POSTS_PER_RUN: '2'
        run: python scripts/generate_posts.py

      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/courses.json data/posts.json blog/ courses/p/
          git diff --staged --quiet || git commit -m "chore: daily courses + blog update [skip ci]"
          git push
