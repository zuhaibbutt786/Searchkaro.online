name: Update courses and blog

on:
  schedule:
    # 10:00 AM Pakistan Standard Time (UTC+5) = 05:00 UTC
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch courses + build on-site pages
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MAX_COURSE_DETAIL: '50'
          PYTHONPATH: scripts
        run: python scripts/fetch_courses.py
        continue-on-error: true

      - name: Generate blog posts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          POSTS_PER_RUN: '2'
          PYTHONPATH: scripts
        run: python scripts/generate_posts.py

      - name: Notify WhatsApp channel (new courses)
        env:
          PYTHONPATH: scripts
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          WHATSAPP_PROVIDER: ${{ secrets.WHATSAPP_PROVIDER }}
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          WHAPI_CHANNEL_ID: ${{ secrets.WHAPI_CHANNEL_ID }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
          WHATSAPP_WEBHOOK_URL: ${{ secrets.WHATSAPP_WEBHOOK_URL }}
          FORCE_WHATSAPP: ${{ github.event_name == 'workflow_dispatch' && '0' || '0' }}
        run: python scripts/notify_whatsapp.py
        continue-on-error: true

      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/courses.json data/posts.json data/courses_seen.json blog/ courses/p/
          git diff --staged --quiet || git commit -m "chore: daily courses + blog + whatsapp [skip ci]"
          git push
