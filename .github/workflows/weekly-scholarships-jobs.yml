name: Weekly scholarships and jobs

on:
  schedule:
    # Sunday 10:00 AM PKT = 05:00 UTC
    - cron: '0 5 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  listings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Scholarships + jobs (detail pages)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MAX_SCHOLARSHIPS: '40'
          MAX_JOBS: '40'
          GROQ_ENRICH_LIMIT: '24'
          PYTHONPATH: scripts
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
        run: python scripts/fetch_feeds.py

      - name: Rebuild homepage + sitemap
        env:
          PYTHONPATH: scripts
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
        run: |
          python scripts/build_home.py
          python scripts/build_sitemap.py

      - name: WhatsApp — scholarships
        env:
          PYTHONPATH: scripts
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          WHATSAPP_PROVIDER: whapi
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          WHAPI_CHANNEL_ID: ${{ secrets.WHAPI_CHANNEL_ID }}
          NOTIFY_MODE: scholarships
        run: python scripts/notify_whatsapp.py
        continue-on-error: true

      - name: WhatsApp — jobs
        env:
          PYTHONPATH: scripts
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          WHATSAPP_PROVIDER: whapi
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          WHAPI_CHANNEL_ID: ${{ secrets.WHAPI_CHANNEL_ID }}
          NOTIFY_MODE: jobs
        run: python scripts/notify_whatsapp.py
        continue-on-error: true

      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scholarships.json data/jobs.json data/scholarships_seen.json data/jobs_seen.json scholarships/ jobs/ index.html sitemap.xml || true
          git diff --staged --quiet || git commit -m "chore: weekly scholarships + jobs [skip ci]"
          git push
