name: Daily free courses

on:
  schedule:
    # 10:00 AM PKT = 05:00 UTC
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  courses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch courses
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MAX_COURSE_DETAIL: '50'
          PYTHONPATH: scripts
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
        run: python scripts/fetch_courses.py
        continue-on-error: true

      - name: Rebuild homepage + sitemap
        env:
          PYTHONPATH: scripts
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
        run: |
          python scripts/build_home.py
          python scripts/build_sitemap.py

      - name: WhatsApp notify (new courses)
        env:
          PYTHONPATH: scripts
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          WHAPI_CHANNEL_ID: ${{ secrets.WHAPI_CHANNEL_ID }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
          WHATSAPP_WEBHOOK_URL: ${{ secrets.WHATSAPP_WEBHOOK_URL }}
        run: python scripts/notify_whatsapp.py
        continue-on-error: true

      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/courses.json data/courses_seen.json courses/p/ index.html sitemap.xml
          git diff --staged --quiet || git commit -m "chore: daily free courses [skip ci]"
          git push
